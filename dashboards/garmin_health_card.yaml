                  </div>
                </div>
                <ha-icon icon="mdi:chart-line-variant" style="width:25px;height:25px;color:rgba(255,255,255,.58);"></ha-icon>
              </div>

              <div style="display:grid;grid-template-columns:1fr;gap:8px;">
                ${flag('mdi:run-fast', 'VO₂max', fmt('sensor.garmin_connect_vo2_max', '', 0), 'mL/kg/min', '190,130,255')}
                ${flag('mdi:bike-fast', 'FTP Cycling', fmt('sensor.garmin_connect_ftp_cycling', ' W', 0), 'Power to weight ' + fmt('sensor.garmin_connect_power_to_weight_cycling', ' W/kg', 2), '90,190,255')}
                ${flag('mdi:heart-flash', 'Lactate threshold HR', fmt('sensor.garmin_connect_lactate_threshold_heart_rate', ' bpm', 0), 'Tröskelpuls', '255,90,120')}
                ${flag('mdi:cake-variant-outline', 'Fitness age', fmt('sensor.garmin_connect_fitness_age', ' år', 1), ageDelta + ' än kronologisk ålder', '120,255,170')}
                ${flag('mdi:target', 'Achievable fitness age', fmt('sensor.garmin_connect_achievable_fitness_age', ' år', 1), 'Garmins uppskattade potential', '255,190,90')}
                ${flag('mdi:scale-bathroom', 'Garmin vikt', fmt('sensor.garmin_connect_weight', ' kg', 1), 'Garmin Connect', '90,165,255')}
                ${flag('mdi:trophy-outline', 'Endurance score', fmt('sensor.garmin_connect_endurance_score', '', 0), 'Uthållighet', '255,210,90')}
                ${flag('mdi:blood-bag', 'Blodtryck', fmt('sensor.garmin_connect_blood_pressure_systolic', '', 0) + '/' + fmt('sensor.garmin_connect_blood_pressure_diastolic', '', 0), raw('sensor.garmin_connect_blood_pressure_category') + ' · puls ' + fmt('sensor.garmin_connect_blood_pressure_pulse', ' bpm', 0), '255,90,120')}
              </div>
            </div>
          `;
        ]]]
    extra_styles: |
      #fitness {
