            </div>`;
        ]]]
    extra_styles: |
      #title { width: 100%; }

  - type: grid
    columns: 2
    square: false
    cards:
      - type: statistic
        entity: sensor.health_snapshot_bodyfit_weight
        name: Vikt Δ30d
        icon: mdi:scale-bathroom
        stat_type: change
        period:
          rolling_window:
            duration:
              days: 30
      - type: statistic
        entity: sensor.health_snapshot_bodyfit_fat_percentage
