            prefix: "Bål "
            style:
              left: 50%
              top: 42%
              transform: translate(-50%, -50%)
              color: white
              background: rgba(0, 0, 0, 0.68)
              border-radius: 12px
              padding: 5px 9px
              font-size: 13px
              font-weight: 600
              white-space: nowrap
          - type: state-label
            entity: sensor.ovrigt_withings_muskelmassa_i_hoger_ben
            prefix: "H ben "
            style:
              left: 39%
              top: 68%
              transform: translate(-50%, -50%)
              color: white
              background: rgba(0, 0, 0, 0.62)
              border-radius: 12px
              padding: 5px 8px
              font-size: 12px
              font-weight: 600
              white-space: nowrap
          - type: state-label
            entity: sensor.ovrigt_withings_muskelmassa_i_vanster_ben
            prefix: "V ben "
            style:
              left: 61%
