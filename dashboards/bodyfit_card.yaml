              font-weight: 600
              white-space: nowrap
          - type: state-label
            entity: sensor.ovrigt_withings_muskelmassa_i_vanster_arm
            prefix: "V arm "
            style:
              left: 80%
              top: 32%
              transform: translate(-50%, -50%)
              color: white
              background: rgba(0, 0, 0, 0.62)
