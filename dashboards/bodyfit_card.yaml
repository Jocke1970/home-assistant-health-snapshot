    custom_fields:
      footer: |
        [[[
          return `
            <div style="padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);font-size:11px;line-height:1.4;color:rgba(255,255,255,.58);font-weight:750;">
              BodyFit-proxyerna startade sin rena trendhistorik 2026-10-03. 30/90-dagarsvärdena använder därför tillgänglig BodyFit-historik tills hela respektive tidsfönster hunnit fyllas.
