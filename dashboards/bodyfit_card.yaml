    chart_type: line
    days_to_show: 30
    period: day
    stat_types:
      - mean
    entities:
      - entity: sensor.health_snapshot_bodyfit_weight
        name: Vikt
      - entity: sensor.health_snapshot_bodyfit_muscle_mass
        name: Muskel
      - entity: sensor.health_snapshot_bodyfit_fat_mass
        name: Fettmassa

  - type: statistics-graph
