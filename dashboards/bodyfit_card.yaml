type: custom:vertical-stack-in-card
cards:
  - type: custom:button-card
    entity: sensor.health_snapshot_bodyfit_weight
    name: BodyFit
    icon: mdi:human-male
    show_state: false
    show_label: true
    label: |
      [[[
        const invalid = ['unknown','unavailable','none','None',''];
        const n = (id) => {
          const s = states[id]?.state;
          const v = parseFloat(s);
          return s !== undefined && !invalid.includes(String(s)) && Number.isFinite(v) ? v : null;
        };
        const fmt = (id, unit = '', d = 1) => {
          const v = n(id);
          return v === null ? '—' : `${v.toFixed(d)}${unit}`;
        };
        const chip = (icon, title, value, accent) => `
          <div style="padding:10px 11px;border-radius:18px;background:rgba(${accent},.09);border:1px solid rgba(${accent},.18);min-width:0;">
            <div style="display:flex;align-items:center;gap:7px;color:var(--secondary-text-color);font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.7px;">
              <ha-icon icon="${icon}" style="width:16px;height:16px;color:var(--secondary-text-color);"></ha-icon>
              ${title}
            </div>
            <div style="font-size:20px;font-weight:950;color:var(--primary-text-color);margin-top:5px;white-space:nowrap;">${value}</div>
          </div>`;
        return `
          <div style="display:flex;flex-direction:column;gap:12px;width:100%;">
            <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:14px;">
              <div>
                <div style="font-size:40px;font-weight:950;letter-spacing:-1.5px;line-height:1;color:var(--primary-text-color);">
                  ${fmt('sensor.health_snapshot_bodyfit_weight',' kg',1)}
                </div>
                <div style="margin-top:6px;font-size:12px;font-weight:850;color:var(--secondary-text-color);">
                  BodyFit trendhistorik · start 2026-10-03
                </div>
              </div>
              <div style="padding:10px 12px;border-radius:18px;background:rgba(90,170,255,.08);border:1px solid rgba(90,170,255,.18);text-align:right;">
                <div style="font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--secondary-text-color);font-weight:950;">Vätska</div>
                <div style="font-size:24px;font-weight:950;color:var(--primary-text-color);line-height:1.1;margin-top:2px;">${fmt('sensor.health_snapshot_bodyfit_water_percentage','%',1)}</div>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;">
              ${chip('mdi:water-percent','Fett',fmt('sensor.health_snapshot_bodyfit_fat_percentage','%',1),'190,130,255')}
              ${chip('mdi:arm-flex','Muskel',fmt('sensor.health_snapshot_bodyfit_muscle_mass',' kg',2),'80,235,180')}
              ${chip('mdi:weight-kilogram','Fettmassa',fmt('sensor.health_snapshot_bodyfit_fat_mass',' kg',2),'255,150,90')}
              ${chip('mdi:human','Fettfri',fmt('sensor.health_snapshot_bodyfit_fat_free_mass',' kg',2),'90,180,255')}
              ${chip('mdi:bone','Benmassa',fmt('sensor.health_snapshot_bodyfit_bone_mass',' kg',2),'235,235,245')}
              ${chip('mdi:stomach','Visceralt',fmt('sensor.health_snapshot_bodyfit_visceral_fat','',1),'255,120,100')}
            </div>
          </div>`;
      ]]]
    styles:
      card:
        - min-height: 280px
        - padding: 20px
        - border-radius: 28px 28px 0 0
        - background: radial-gradient(circle at 88% 10%, rgba(190,130,255,.10), transparent 34%), radial-gradient(circle at 8% 0%, rgba(80,200,255,.10), transparent 36%), var(--ha-card-background, var(--card-background-color))
        - border: 1px solid var(--divider-color)
        - box-shadow: 0 6px 22px rgba(0,0,0,.08)
        - overflow: hidden
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 58px 1fr
        - grid-template-rows: min-content 1fr
      icon:
        - width: 34px
        - color: var(--primary-text-color)
      img_cell:
        - width: 54px
        - height: 54px
        - border-radius: 20px
        - background: rgba(90,170,255,.10)
        - border: 1px solid rgba(90,170,255,.18)
      name:
        - justify-self: start
        - font-size: 20px
        - font-weight: 950
        - color: var(--primary-text-color)
      label:
        - justify-self: stretch
        - text-align: left
        - color: var(--primary-text-color)
        - white-space: normal

  - type: custom:expander-card
